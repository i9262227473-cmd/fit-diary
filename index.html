<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фитнес Дневник</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { background: #2c7da0; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin: 5px; }
        .food-item, .workout-item { background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 12px; display: flex; justify-content: space-between; }
        .delete-btn { background: #ff6b6b; padding: 4px 12px; border-radius: 20px; }
        .stats { display: flex; gap: 20px; margin: 15px 0; }
        .stat { background: #e9ecef; padding: 10px; border-radius: 16px; text-align: center; flex: 1; }
        .stat-value { font-size: 24px; font-weight: bold; color: #2c7da0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏋️ Фитнес Дневник</h1>
        <div class="stats">
            <div class="stat"><div class="stat-value" id="calories">0</div><div>калорий / 2100</div></div>
            <div class="stat"><div class="stat-value" id="protein">0</div><div>белок / 140г</div></div>
        </div>
        <div>
            <button id="addFoodBtn">🍽️ Добавить еду</button>
            <button id="addWorkoutBtn">🏋️ Тренировка</button>
            <button id="setWeightBtn">⚖️ Вес</button>
        </div>
        <div>Вес: <strong id="weight">70</strong> кг</div>
    </div>
    <div class="card"><h3>🍽️ Приёмы пищи</h3><div id="foodList">Нет записей</div></div>
    <div class="card"><h3>🏋️ Тренировки</h3><div id="workoutList">Нет тренировок</div></div>

    <script>
        let foods = [], workouts = [], weight = 70;
        
        function updateUI() {
            let totalCal = 0, totalProtein = 0;
            foods.forEach(f => { totalCal += f.calories; totalProtein += f.protein; });
            let burned = workouts.reduce((s,w) => s + w.calories, 0);
            document.getElementById('calories').innerText = Math.max(0, totalCal - burned);
            document.getElementById('protein').innerText = totalProtein;
            document.getElementById('weight').innerText = weight;
            
            const foodDiv = document.getElementById('foodList');
            if(foods.length === 0) foodDiv.innerHTML = 'Нет записей';
            else {
                foodDiv.innerHTML = '';
                foods.forEach((f,i) => {
                    foodDiv.innerHTML += `<div class="food-item"><span>${f.name} — ${f.calories} ккал, белок ${f.protein}г</span><button class="delete-btn" onclick="deleteFood(${i})">✖</button></div>`;
                });
            }
            
            const workoutDiv = document.getElementById('workoutList');
            if(workouts.length === 0) workoutDiv.innerHTML = 'Нет тренировок';
            else {
                workoutDiv.innerHTML = '';
                workouts.forEach((w,i) => {
                    workoutDiv.innerHTML += `<div class="workout-item"><span>${w.name} — ${w.duration} мин, -${w.calories} ккал</span><button class="delete-btn" onclick="deleteWorkout(${i})">✖</button></div>`;
                });
            }
            localStorage.setItem('fitDiary', JSON.stringify({ foods, workouts, weight }));
        }
        
        function deleteFood(i) { foods.splice(i,1); updateUI(); }
        function deleteWorkout(i) { workouts.splice(i,1); updateUI(); }
        
        document.getElementById('addFoodBtn').onclick = () => {
            let name = prompt('Название блюда:'); if(!name) return;
            let calories = parseInt(prompt('Калории:',0));
            let protein = parseInt(prompt('Белки:',0));
            if(calories) { foods.push({name, calories, protein}); updateUI(); }
        };
        
        document.getElementById('addWorkoutBtn').onclick = () => {
            let name = prompt('Название тренировки:'); if(!name) return;
            let duration = parseInt(prompt('Минуты:',30));
            let calories = parseInt(prompt('Сожжено калорий:',200));
            if(duration) { workouts.push({name, duration, calories}); updateUI(); }
        };
        
        document.getElementById('setWeightBtn').onclick = () => {
            let w = parseFloat(prompt('Вес в кг:', weight));
            if(w) { weight = w; updateUI(); }
        };
        
        let saved = localStorage.getItem('fitDiary');
        if(saved) { let data = JSON.parse(saved); foods = data.foods || []; workouts = data.workouts || []; weight = data.weight || 70; updateUI(); }
        else updateUI();
    </script>
</body>
</html>
